name: Nusa Android build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix/immersive-artwork-offset-20261009
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradlew"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradlew"
      - ".github/workflows/android-build.yml"

jobs:
  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Accompanist Lyrics Core's JVM test dependency uses Java 21 bytecode.
          java-version: "21"
          cache: gradle
      - name: Diagnose public Spotify Canvas resolver (PR 176)
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 176
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.error
          urls = [
              'https://www.spotycovs.lol/api/resolve?track=SZA%20-%20Snooze%26results=1',
              'https://www.spotycovs.lol/api/canvas?track=SZA%20-%20Snooze%26results=1',
              'https://www.spotycovs.lol/api/canvas?id=3zlJIBfHmFMjvT8TtGf1BW',
          ]
          for url in urls:
              # These are public example songs, not user's metadata or tokens.
              url = url.replace('%26results=1', '&results=1')
              try:
                  req = urllib.request.Request(url, headers={
                      'Accept': 'application/json',
                      'User-Agent': 'NusaMusic/SpotifyCanvasFallback'
                  })
                  with urllib.request.urlopen(req, timeout=12) as r:
                      payload = r.read(3500).decode('utf-8', errors='replace')
                      print('URL:', url, 'HTTP:', r.status, 'TYPE:', r.headers.get('content-type'))
                      print('RESPONSE:', payload[:1800])
              except Exception as e:
                  print('URL:', url, 'ERROR:', str(e)[:400])
          PY

      - name: Temporary Spotify Canvas API response diagnostic
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 176 }}
        run: |
          python3 - <<'PY'
          import json, urllib.parse, urllib.request, urllib.error
          targets = [
              "https://www.spotycovs.lol/api/canvas?track=SZA%20-%20Snooze&results=1",
              "https://www.spotycovs.lol/api/search?track=SZA%20-%20Snooze",
              "https://www.spotycovs.lol/api/resolve?track=SZA%20-%20Snooze&results=1",
              "https://www.spotycovs.lol/api/canvas?id=3zlJIBfHmFMjvT8TtGf1BW",
              "https://spotycovs.lol/api/canvas?track=SZA%20-%20Snooze&results=1",
          ]
          for url in targets:
              print("DIAG endpoint",url,flush=True)
              try:
                  req=urllib.request.Request(url,headers={"User-Agent":"NusaMusic/SpotifyCanvasFallback", "Accept":"application/json"})
                  with urllib.request.urlopen(req,timeout=10) as response:
                      body=response.read(45000).decode("utf-8","replace")
                      print("DIAG status",response.status,"url",response.geturl(),"type",response.headers.get("Content-Type"),flush=True)
                      try:
                          obj=json.loads(body)
                          print("DIAG json",json.dumps(obj,ensure_ascii=False)[:2400],flush=True)
                      except ValueError:print("DIAG non-json",body[:180],flush=True)
              except Exception as error:print("DIAG error",type(error).__name__,str(error)[:250],flush=True)
          PY

      - name: Compile Android sources and run unit tests
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      # Keep failing unit tests visible, but don't block the requested debug
      # APK. This build is separate from release gating and is not test-passed.
      - name: Assemble debug APK for main, manual, or NusaMusic PR 176
        id: apk
        if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.number == 176)) }}
        run: |
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload NusaMusic APK for phone download
        if: ${{ !cancelled() && steps.apk.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: NusaMusic-latest-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
