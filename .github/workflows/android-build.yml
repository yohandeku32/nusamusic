name: Nusa Android build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix/immersive-artwork-offset-20261009
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradlew"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradlew"
      - ".github/workflows/android-build.yml"

jobs:
  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Accompanist Lyrics Core's JVM test dependency uses Java 21 bytecode.
          java-version: "21"
          cache: gradle
      - name: Compile Android sources and run unit tests
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Upload Discovery layout previews
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: Discovery-layout-previews
          path: app/build/reports/discovery-preview/*.png
          if-no-files-found: ignore
          retention-days: 7

      # Keep failing unit tests visible, but don't block the requested debug
      # APK. This build is separate from release gating and is not test-passed.
      - name: Assemble debug APK for main, manual, or NusaMusic PR 176/178
        id: apk
        if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.number == 176 || github.event.pull_request.number == 178)) }}
        run: |
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload NusaMusic APK for phone download
        if: ${{ !cancelled() && steps.apk.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: NusaMusic-latest-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
