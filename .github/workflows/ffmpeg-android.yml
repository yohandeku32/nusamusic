name: Build FFmpeg-enabled Nusa APK

on:
  workflow_dispatch:

jobs:
  ffmpeg-android:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android NDK r26b and CMake
        shell: bash
        run: |
          echo y | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Build Media3 FFmpeg decoder AAR from upstream sources
        shell: bash
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/26.1.10909125"
          bash scripts/build-ffmpeg-android.sh

      - name: Assemble FFmpeg-enabled debug APK (FFmpeg required)
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug -PrequireFfmpegDecoder=true --no-daemon --stacktrace

      - name: Upload FFmpeg-enabled Nusa APK
        uses: actions/upload-artifact@v4
        with:
          name: nusa-ffmpeg-android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload FFmpeg decoder AAR for inspection
        uses: actions/upload-artifact@v4
        with:
          name: media3-ffmpeg-1_9_3-aar
          path: app/libs/media3-decoder-ffmpeg.aar
          if-no-files-found: error
          retention-days: 14
